name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/ZodSharp.slnx

      - name: Build
        run: dotnet build src/ZodSharp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/ZodSharp.slnx -c Release --no-build --treenode-filter "/*/*/*/*/"

      - name: Pack
        run: dotnet pack src/ZodSharp.slnx -c Release --no-build -o ./artifacts

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .
